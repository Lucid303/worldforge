name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build (tries everything, falls back to less if something cannot be built)
        run: |
          if gradle build -Pextras -Pjei -Pemi --no-daemon; then
            echo "BUILD RESULT: everything included (extra forges + JEI + EMI)"
          elif gradle build -Pextras --no-daemon; then
            echo "BUILD RESULT: extra forges included, JEI/EMI plugins NOT included"
          else
            echo "BUILD RESULT: core only (the extra forges could not be built)"
            gradle build --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: worldforge-jar
          path: build/libs/*.jar

      - name: Publish the jar on the GitHub Releases page (only when the push is a tag like v0.7.1)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "World Forge $GITHUB_REF_NAME" \
              --notes "Download the .jar file below and put it in your mods folder (NeoForge 1.21.1). SHA256SUMS.txt lets you check the file was not changed."
          gh release upload "$GITHUB_REF_NAME" *.jar SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
